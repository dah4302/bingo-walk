<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浜北森林公園 ビンゴウォーク</title>

<style>
body{
font-family:sans-serif;
background:#f5f7f5;
margin:0;
padding:10px;
text-align:center;
}

h1{
color:#176b43;
margin-bottom:5px;
}

.notice{
background:#fff4d8;
border:2px solid #f4a024;
border-radius:10px;
padding:10px;
font-weight:bold;
margin-bottom:10px;
}

.team{
background:white;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.team input{
width:95%;
padding:10px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
max-width:600px;
margin:auto;
}

.cell{
background:white;
border:2px solid #ccc;
border-radius:10px;
height:110px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
cursor:pointer;
font-size:18px;
}

.done{
background:#c8e6c9;
border-color:#176b43;
}

.actions{
margin-top:10px;
}

button{
padding:12px 20px;
font-size:17px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
}

.judge{
background:#176b43;
color:white;
}

.reset{
background:#c62828;
color:white;
}

#status{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
}
</style>
</head>

<body>

<h1>ビンゴウォーク</h1>
<p>浜北森林公園</p>

<div class="notice">
撮影はスマホのカメラで行い、この画面ではチェックのみ行います。
</div>

<div class="team">
<label>
ランニングクラブチーム名（受付確認用）
</label><br><br>

<input
id="team"
placeholder="例：ランニングクラブチーム">
</div>

<div class="grid" id="grid"></div>

<div class="actions">
<button class="judge" onclick="judge()">
ビンゴ判定
</button>

<button class="reset" onclick="resetBoard()">
やり直し
</button>
</div>

<div id="status"></div>

<div class="modal" id="modal">
<div class="modal-content">

<h2>🎉 ビンゴ達成！</h2>

<h3 id="teamName"></h3>

<p>
受付スタッフへこの画面を見せてください
</p>

<button onclick="closeModal()">
閉じる
</button>

</div>
</div>

<script>

const items=[
"鳥",
"川・水辺",
"花",
"ベンチ",
"FREE",
"橋",
"木の実",
"看板",
"大きな木"
];

const grid=document.getElementById("grid");

items.forEach((item,index)=>{

const cell=document.createElement("div");

cell.className="cell";

cell.innerHTML=item;

if(index===4){

cell.classList.add("done");

}else{

cell.onclick=()=>{

cell.classList.toggle("done");

saveState();

};

}

grid.appendChild(cell);

});

function saveState(){

const state=[];

document.querySelectorAll(".cell").forEach(c=>{

state.push(c.classList.contains("done"));

});

localStorage.setItem(
"bingoState",
JSON.stringify(state)
);

localStorage.setItem(
"teamName",
document.getElementById("team").value
);

}

function loadState(){

const state=
JSON.parse(
localStorage.getItem("bingoState")
);

if(state){

document
.querySelectorAll(".cell")
.forEach((c,i)=>{

if(state[i])
c.classList.add("done");

});

}

document.getElementById("team").value=
localStorage.getItem("teamName") || "";

}

document.getElementById("team")
.addEventListener("input",saveState);

loadState();

function judge(){

const c=document
.querySelectorAll(".cell");

const d=[];

for(let i=0;i<9;i++){

d.push(
c[i].classList.contains("done")
);

}

const bingo=

(d[0]&&d[1]&&d[2])||
(d[3]&&d[4]&&d[5])||
(d[6]&&d[7]&&d[8])||
(d[0]&&d[3]&&d[6])||
(d[1]&&d[4]&&d[7])||
(d[2]&&d[5]&&d[8])||
(d[0]&&d[4]&&d[8])||
(d[2]&&d[4]&&d[6]);

if(bingo){

document
.getElementById("teamName")
.innerText=
document.getElementById("team").value
|| "ランニングクラブチーム";

document
.getElementById("modal")
.style.display="flex";

}else{

document
.getElementById("status")
.innerHTML=
"まだビンゴではありません";

}

}

function closeModal(){

document
.getElementById("modal")
.style.display="none";

}

function resetBoard(){

if(!confirm("リセットしますか？"))
return;

localStorage.clear();
location.reload();

}

</script>

</body>
</html>
